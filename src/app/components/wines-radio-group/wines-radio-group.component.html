<ion-radio-group
  class="wine-type-group"
  [value]="control?.value"
  mode="md">

  @if (row) {
    <div class="wine-type-options">
      <ng-container *ngTemplateOutlet="wineTypeOptions"></ng-container>
    </div>
  } @else {
    <ng-container *ngTemplateOutlet="wineTypeOptions"></ng-container>
  }

  <ng-template #wineTypeOptions>
  <ion-item
    *ngFor="let option of options"
    lines="none"
    button
    class="chip wine-type-option"
    [class.wine-type-option--row]="row"
    [class.selected]="isSelected(option.value)"
    (click)="select(option.value)">

    @if (option.icon) {
      <div
        class="chip-swatch"
        [attr.slot]="row ? null : 'start'"
        [style.background]="option.backgroundColor">
        <img
          [src]="option.icon"
          [alt]="option.label | transloco"/>
      </div>
    }

    <ion-label class="chip-label">
      {{ option.label | transloco }}
    </ion-label>

    <ion-radio
      [attr.slot]="row ? null : 'end'"
      [value]="option.value">
    </ion-radio>

  </ion-item>
  </ng-template>

</ion-radio-group>
