name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installation (reproductible)
        run: npm ci

      - name: Cohérence des traductions
        run: npm run check:i18n

      - name: Cohérence des icônes
        run: npm run check:icons

      - name: Lint
        run: npm run lint

      - name: Tests unitaires
        run: npm run test:ci

      - name: Build de production
        run: npm run build:prod
