<label class="input-label">
  {{ label }}
  @if (showRequirement && required) {
    <span class="input-label__required" aria-label="obligatoire">*</span>
  }
</label>

<div class="text-area-field">
  <ion-textarea
    class="text-area-form"
    mode="md"
    fill="outline"
    [formControl]="$any(control)"
    [placeholder]="placeholder"
    [autoGrow]="autoGrow">
  </ion-textarea>
</div>

<form-error [control]="control"></form-error>
