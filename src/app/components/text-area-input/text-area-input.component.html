<label class="input-label">
  {{ label }}
  @if (showRequirement && required) {
    <span class="input-label__required" [attr.aria-label]="'COMMON.REQUIRED' | transloco">*</span>
  }
</label>

<div class="text-area-field">
  <ion-textarea
    class="text-area-form"
    mode="md"
    fill="outline"
    [formControl]="$any(control)"
    [placeholder]="placeholder"
    [autoGrow]="autoGrow">
  </ion-textarea>
</div>

<app-form-error [control]="control"></app-form-error>
